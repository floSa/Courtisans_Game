[project]
name = "courtisans-game"
version = "0.1.0"
description = "Courtisans card game with an AlphaZero-style AI and a Streamlit UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dm-tree>=0.1.10",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "open-spiel>=2.0.1",
    "pillow>=12.3.0",
    "streamlit>=1.60.0",
    "torch>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.scripts]
courtisans = "courtisans_game.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
