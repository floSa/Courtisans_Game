[project]
name = "courtisans"
version = "0.1.0"
description = "Moteur de regles du jeu de cartes Courtisans"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# open_spiel n'est utilise que par l'adaptateur et ses tests. Le coeur ne l'importe pas :
# le critere A4 le verifie dans un sous-processus.
dev = ["pytest>=8.0", "ruff>=0.6", "open_spiel>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["lent: cas qui joue un gros volume de parties (critere A3)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
